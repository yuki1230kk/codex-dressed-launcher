name: Source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: bash -n macos/install.sh macos/uninstall.sh macos/launch-once.sh
      - run: swiftc -framework AppKit -framework AVFoundation macos/main.swift -o /tmp/DressedLauncher && /tmp/DressedLauncher --self-test
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - shell: powershell
        run: .\tests\windows-tests.ps1
